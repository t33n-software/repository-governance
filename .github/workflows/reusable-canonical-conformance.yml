permissions:
  contents: read

concurrency:
  group: canonical-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Canonical bindings verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify canonical bindings
        uses: t33n-software/repository-governance/.github/actions/verify-canonical-files@f38487662a91b52ad026c9c8c2333f008b4757e4
