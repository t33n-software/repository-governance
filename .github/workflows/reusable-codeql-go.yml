name: CodeQL (go) — reusable

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  GOTOOLCHAIN: local
  GOVCS: "*:off"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          directive="$(
            awk '{ sub(/\r$/, "") }
                 $1 == "toolchain" { count += 1; directive = $2; trailing = $3 }
                 END {
                   if (count != 1) exit 1
                   if (trailing != "" && trailing !~ /^\/\//) exit 1
                   if (directive !~ /^go[0-9]+\.[0-9]+\.[0-9]+$/) exit 1
                   print directive
                 }' go.mod
          )" || {
            echo "go.mod must carry exactly one pinned toolchain directive of the form 'toolchain goX.Y.Z' (never the go directive, never the latest patch)" >&2
            exit 1
          }
          echo "resolved the pinned toolchain directive: $directive"
          echo "version=${directive#go}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: go
          build-mode: manual

      - name: Verify Go modules
        env:
          GOFLAGS: -mod=readonly
        run: go mod verify

      - name: Build Go for analysis
        env:
          GOFLAGS: -mod=readonly
        run: go build ./...

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        env:
          GOFLAGS: -mod=readonly
