name: Set up controlled Go
description: >-
  Checks out the calling repository, provisions exactly the Go toolchain
  pinned by the toolchain directive of the tenant's go.mod (resolved
  fail-closed — never the go directive, never the latest patch), and asserts
  the controlled toolchain identity before any governed step runs.
inputs:
  goos:
    description: The expected GOOS of the runner; asserted when provided.
    required: false
    default: ""
  goarch:
    description: The expected GOARCH of the runner; asserted when provided.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check out source
      uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      with:
        persist-credentials: false

    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        directive="$(
          awk '{ sub(/\r$/, "") }
               $1 == "toolchain" { count += 1; directive = $2; trailing = $3 }
               END {
                 if (count != 1) exit 1
                 if (trailing != "" && trailing !~ /^\/\//) exit 1
                 if (directive !~ /^go[0-9]+\.[0-9]+\.[0-9]+$/) exit 1
                 print directive
               }' go.mod
        )" || {
          echo "go.mod must carry exactly one pinned toolchain directive of the form 'toolchain goX.Y.Z' (never the go directive, never the latest patch)" >&2
          exit 1
        }
        echo "resolved the pinned toolchain directive: $directive"
        echo "version=${directive#go}" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ steps.toolchain.outputs.version }}
        check-latest: false
        cache: false

    - name: Verify controlled Go toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(go env GOTOOLCHAIN)" = "local"
        if [ -n "${{ inputs.goos }}" ]; then test "$(go env GOOS)" = "${{ inputs.goos }}"; fi
        if [ -n "${{ inputs.goarch }}" ]; then test "$(go env GOARCH)" = "${{ inputs.goarch }}"; fi
