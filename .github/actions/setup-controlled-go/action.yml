name: Set up controlled Go
description: >-
  Checks out the calling repository, provisions the pinned Go toolchain from
  the tenant's go.mod (the Go-native toolchain selector), and asserts the
  controlled toolchain identity before any governed step runs.
inputs:
  goos:
    description: The expected GOOS of the runner; asserted when provided.
    required: false
    default: ""
  goarch:
    description: The expected GOARCH of the runner; asserted when provided.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check out source
      uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false

    - name: Verify controlled Go toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(go env GOTOOLCHAIN)" = "local"
        if [ -n "${{ inputs.goos }}" ]; then test "$(go env GOOS)" = "${{ inputs.goos }}"; fi
        if [ -n "${{ inputs.goarch }}" ]; then test "$(go env GOARCH)" = "${{ inputs.goarch }}"; fi
