name: Verify canonical files
description: >-
  Runs the canonical conformance verifier (verify-canonical) against the
  calling repository: caller hashes and pins, canonical file equality,
  CODEOWNERS and conventions README materialization, config-seam conformance,
  capability-pack resolution, tool-pin admission, and the license content
  proof through the tenant-pinned hub CLI.
inputs:
  repo:
    description: The repository root to verify.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Set up controlled Go
      uses: t33n-software/repository-governance/.github/actions/setup-controlled-go@163bc21ca2120058a04555ef0dcc4eebb7fa39a2

    - name: Run the canonical conformance verifier
      shell: bash
      run: go tool -modfile tools/go.mod verify-canonical --repo "${{ inputs.repo }}"
