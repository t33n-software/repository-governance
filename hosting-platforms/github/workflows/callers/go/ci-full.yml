name: CI

on:
  push:
    branches: [main, develop, "release/**", "support/**"]
  pull_request:
    branches: [main, develop, "release/**", "support/**"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality gates
    permissions:
      contents: read
    uses: t33n-software/repository-governance/.github/workflows/reusable-ci-go.yml@c4d870b7e24d8959c13b46b935983877a349b2b4
    with:
      quality_class: full
